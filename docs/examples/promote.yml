# Per-service dev/qa promotion wrapper — copy to .github/workflows/promote.yml
#
# One executable workflow for both environments: `shared-service-promote.yml`
# selects the branch to deploy and syncs the service's ArgoCD Application for
# the target environment through the ArgoCD API — dev/qa imports go straight
# to the matching app, with no PR and no deploy refs. A real promote to `qa`
# runs against the repo's `qa` GitHub Environment: with "Required reviewers"
# configured on it, a human approves in the Actions UI before the sync runs.
# Only `main` exists in the repo; PRs appear only on the prod path
# (docs/service-release-model.md).
#
# Requirements on the service repo:
#   - secrets ARGOCD_SERVER / ARGOCD_TOKEN at repository or organization
#     level (recommended, passed explicitly below). Alternative: scope them
#     to the `dev` / `qa` GitHub Environments and use `secrets: inherit`
#     instead — environment secrets are resolved by the reusable job that
#     targets that environment.
#   - GitHub Environment `dev` (no reviewers) and `qa` with Required
#     reviewers (public repos on Free/Pro/Team, or Enterprise Cloud for
#     private ones).
#   - the Application name defaults to <service>-<environment>; pass `app`
#     explicitly if the infra registry names it differently.
#   - `packages: write` is required because the nested publish job requests it;
#     grant it even though publishing is optional.

name: Promote

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev or qa)"
        type: choice
        options: [dev, qa]
        required: true
      branch:
        description: "Branch (or tag) to deploy; defaults to the head of main"
        type: string
        default: main
      service:
        description: "Service name (ApplicationSet element name)"
        type: string
        required: true
      app:
        description: "ArgoCD Application name; defaults to <service>-<environment>"
        type: string
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-${{ github.repository }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.environment }}
    uses: sca-templates/CI-CD-Templates/.github/workflows/shared-service-promote.yml@main
    with:
      environment: ${{ inputs.environment }}
      service: ${{ inputs.service }}
      app: ${{ inputs.app }}
      revision: ${{ inputs.branch }}
    secrets:
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
