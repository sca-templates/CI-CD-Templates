---
name: GitOps Bump Image
description: Update image.tag in a GitOps manifest and commit directly or open a pull request.

inputs:
  environment:
    description: Target environment (dev, qa or prod)
    required: true
  service:
    description: Service name; controls the manifest path envs/<environment>/<service>.yaml
    required: true
  image-tag:
    description: Container image tag to promote (matches ^[A-Za-z0-9][A-Za-z0-9._-]*$)
    required: true
  gitops-repo:
    description: GitOps repository (owner/repo) to update
    required: false
    default: "sca-templates/infra-kubernetes"
  base-branch:
    description: Base branch of the GitOps repository
    required: false
    default: "main"
  manifest-path:
    description: Overrides the manifest path; defaults to envs/<environment>/<service>.yaml
    required: false
    default: ""
  mode:
    description: "commit (direct push to base branch) or pr (open a pull request)"
    required: false
    default: "commit"
  dry-run:
    description: Report the change without committing or opening a PR
    required: false
    default: "false"
  bot-token:
    description: GitHub App token with write access to the GitOps repository
    required: true
  commit-author-name:
    description: Git author name for the promotion commit
    required: false
    default: "sca-bot-release"
  commit-author-email:
    description: Git author email for the promotion commit
    required: false
    default: "sca-bot-release@users.noreply.github.com"

outputs:
  updated:
    description: "'true' when image.tag changed (or would change in dry-run), 'false' when already up to date"
    value: "${{ steps.bump.outputs.updated }}"
  current-tag:
    description: Image tag currently set in the manifest before the change
    value: "${{ steps.bump.outputs.current-tag }}"
  commit-sha:
    description: SHA of the promotion commit (empty in dry-run)
    value: "${{ steps.bump.outputs.commit-sha }}"
  pr-url:
    description: Pull request URL when mode=pr (empty otherwise)
    value: "${{ steps.bump.outputs.pr-url }}"

runs:
  using: composite
  steps:
    - name: Install yq
      id: yq
      shell: bash
      run: |
        set -euo pipefail
        YQ_TAG="4.53.6"
        SHA256="c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385"
        DIR="$RUNNER_TOOL_CACHE/yq/${YQ_TAG}/x64"
        BIN="$DIR/yq"
        if [ ! -x "$BIN" ]; then
          mkdir -p "$DIR"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/v${YQ_TAG}/yq_linux_amd64" -o "${BIN}.tmp"
          echo "${SHA256}  ${BIN}.tmp" | sha256sum -c -
          mv "${BIN}.tmp" "$BIN"
          chmod +x "$BIN"
        fi
        echo "path=$BIN" >> "$GITHUB_OUTPUT"

    - name: Bump image tag
      id: bump
      shell: bash
      env:
        environment: ${{ inputs.environment }}
        service: ${{ inputs.service }}
        image_tag: ${{ inputs.image-tag }}
        gitops_repo: ${{ inputs.gitops-repo }}
        base_branch: ${{ inputs.base-branch }}
        manifest_path: ${{ inputs.manifest-path }}
        mode: ${{ inputs.mode }}
        dry_run: ${{ inputs.dry-run }}
        bot_token: ${{ inputs.bot-token }}
        commit_author_name: ${{ inputs.commit-author-name }}
        commit_author_email: ${{ inputs.commit-author-email }}
        yq: ${{ steps.yq.outputs.path }}
        GH_TOKEN: ${{ inputs.bot-token }}
      run: |
        set -euo pipefail

        case "$environment" in
          dev|qa|prod) ;;
          *) echo "::error::environment must be dev, qa or prod (got '$environment')"; exit 1 ;;
        esac
        case "$mode" in
          commit|pr) ;;
          *) echo "::error::mode must be commit or pr (got '$mode')"; exit 1 ;;
        esac
        if ! [[ "$image_tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
          echo "::error::image-tag '$image_tag' is not a valid container tag"
          exit 1
        fi

        if [ -n "$manifest_path" ]; then
          MANIFEST="$manifest_path"
        else
          MANIFEST="envs/${environment}/${service}.yaml"
        fi

        GITOPS_DIR="$RUNNER_TEMP/gitops-promote"
        rm -rf "$GITOPS_DIR"
        mkdir -p "$GITOPS_DIR"

        echo "Cloning ${gitops_repo}@${base_branch}..."
        git -c "http.extraHeader=Authorization: Bearer ${bot_token}" clone --quiet --depth 1 \
          --branch "$base_branch" "https://github.com/${gitops_repo}.git" "$GITOPS_DIR"

        cd "$GITOPS_DIR"
        git config user.name "$commit_author_name"
        git config user.email "$commit_author_email"

        if [ ! -f "$MANIFEST" ]; then
          echo "::error::manifest not found: $MANIFEST in ${gitops_repo}@${base_branch}"
          exit 1
        fi

        CURRENT_TAG="$("$yq" eval '.image.tag' "$MANIFEST")"
        echo "current-tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

        if [ "$CURRENT_TAG" = "$image_tag" ]; then
          echo "No change — image.tag already $image_tag in ${gitops_repo}"
          echo "updated=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        "$yq" eval -i ".image.tag = \"$image_tag\"" "$MANIFEST"

        if [ "$dry_run" = "true" ]; then
          echo "::warning::dry-run — change NOT committed"
          git --no-pager diff -- "$MANIFEST"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        COMMIT_MSG="chore: promote ${service} to ${image_tag} in ${environment}"

        if [ "$mode" = "pr" ]; then
          BRANCH="promote/${environment}-${service}-${image_tag}"
          EXISTING_PR="$(gh pr list --repo "$gitops_repo" --state open --head "$BRANCH" --json url --jq '.[0].url' 2>/dev/null || true)"
          if [ -n "$EXISTING_PR" ]; then
            echo "Reusing open PR for ${BRANCH}: ${EXISTING_PR}"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "pr-url=$EXISTING_PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -q -b "$BRANCH"
          git add -- "$MANIFEST"
          git commit -q -m "$COMMIT_MSG"
          git -c "http.extraHeader=Authorization: Bearer ${bot_token}" push -q -u origin "$BRANCH"
          PR_URL="$(gh pr create --repo "$gitops_repo" --base "$base_branch" --head "$BRANCH" \
            --title "$COMMIT_MSG" \
            --body "Automated promotion of \`${service}\` to \`${image_tag}\` in \`${environment}\`. ArgoCD will deploy once approved and merged.")"
          echo "Opened ${PR_URL}"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pr-url=$PR_URL" >> "$GITHUB_OUTPUT"
        else
          git add -- "$MANIFEST"
          git commit -q -m "$COMMIT_MSG"
          git -c "http.extraHeader=Authorization: Bearer ${bot_token}" push -q origin "HEAD:$base_branch"
          echo "Promoted ${service}@${image_tag} -> ${gitops_repo}@${base_branch} ($MANIFEST)"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        fi
