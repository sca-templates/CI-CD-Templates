---
name: Mint GitHub App Token
description: Mint a short-lived GitHub App installation token for automation (sca bots).

inputs:
  client-id:
    description: GitHub App Client ID
    required: true
  private-key:
    description: GitHub App private key (PEM)
    required: true
  owner:
    description: Repository owner/organization the app is installed on
    required: false
    default: "${{ github.repository_owner }}"
  repositories:
    description: Comma-separated list of repositories the token should target
    required: false
    default: "${{ github.event.repository.name }}"

outputs:
  token:
    description: Short-lived GitHub App installation token
    value: "${{ steps.token.outputs.token }}"

runs:
  using: composite
  steps:
    - name: Mint token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
