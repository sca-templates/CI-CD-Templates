---
name: Notify Release
description: Send a release notification to Slack or Discord via webhook. Skips silently when no webhook is configured.

inputs:
  webhook-url:
    description: Slack or Discord webhook URL; when empty the step is skipped silently
    required: false
    default: ""
  platform:
    description: Notification platform (slack or discord)
    required: false
    default: "slack"
  token:
    description: GitHub token used to fetch the release notes (github.token is enough)
    required: false
    default: ""
  repo:
    description: Repository (owner/repo) that published the release
    required: false
    default: "${{ github.repository }}"
  release-tag:
    description: Release tag name (e.g. v1.2.0); the notes are fetched from the API
    required: false
    default: ""
  release-name:
    description: Release title; falls back to the tag when empty
    required: false
    default: ""
  release-url:
    description: URL of the release on GitHub; defaults to the API-fetched html_url
    required: false
    default: ""
  summary-lines:
    description: Number of non-empty release note lines to include (0 = full body)
    required: false
    default: "7"

outputs:
  notified:
    description: "'true' when the webhook was called, 'false' when skipped (no webhook)"
    value: "${{ steps.notify.outputs.notified }}"

runs:
  using: composite
  steps:
    - name: Notify release
      id: notify
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        PLATFORM: ${{ inputs.platform }}
        TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        RELEASE_NAME: ${{ inputs.release-name }}
        RELEASE_URL: ${{ inputs.release-url }}
        SUMMARY_LINES: ${{ inputs.summary-lines }}
      run: |
        set -euo pipefail

        if [ -z "${WEBHOOK_URL}" ]; then
          echo "::debug::no webhook configured; skipping release notification"
          echo "notified=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        case "${PLATFORM}" in
          slack|discord) ;;
          *) echo "::error::platform must be slack or discord (got '${PLATFORM}')"; exit 1 ;;
        esac

        PAYLOAD="$(mktemp)"
        export PAYLOAD PLATFORM REPO RELEASE_TAG RELEASE_NAME RELEASE_URL SUMMARY_LINES TOKEN

        python3 - <<'PYEOF'
        import json
        import os

        def release_details():
            """Fetch release metadata from the GitHub API when a token and tag are given."""
            import urllib.request
            repo = os.environ.get("REPO", "")
            tag = os.environ.get("RELEASE_TAG", "")
            token = os.environ.get("TOKEN", "")
            if not repo or not tag or not token:
                return {}
            url = "https://api.github.com/repos/{0}/releases/tags/{1}".format(repo, tag)
            req = urllib.request.Request(url, headers={
                "Accept": "application/vnd.github+json",
                "Authorization": "Bearer {0}".format(token),
                "X-GitHub-Api-Version": "2022-11-28",
            })
            try:
                with urllib.request.urlopen(req, timeout=15) as resp:
                    data = json.load(resp)
                    return {
                        "name": data.get("name") or "",
                        "body": data.get("body") or "",
                        "html_url": data.get("html_url") or "",
                    }
            except Exception:
                return {}

        fetched = release_details()

        platform = os.environ.get("PLATFORM", "slack")
        repo = os.environ.get("REPO", "")
        name = os.environ.get("RELEASE_NAME", "") or fetched.get("name") or ""
        tag = os.environ.get("RELEASE_TAG", "")
        title = name if name else (tag if tag else "a new release")
        body = fetched.get("body", "") or ""
        url = os.environ.get("RELEASE_URL", "") or fetched.get("html_url", "")
        try:
            summary_lines = int(os.environ.get("SUMMARY_LINES", "7"))
        except ValueError:
            summary_lines = 0

        lines = [line.rstrip() for line in body.splitlines() if line.strip()]
        if summary_lines > 0:
            lines = lines[:summary_lines]

        msg = "[Release] {0} - {1}".format(repo, title)
        if url:
            msg += "\n{0}".format(url)
        if lines:
            msg += "\n\n{0}".format("\n".join("- {0}".format(line) for line in lines))

        payload = {"text": msg} if platform == "slack" else {"content": msg}
        with open(os.environ["PAYLOAD"], "w", encoding="utf-8") as fh:
            json.dump(payload, fh)
        PYEOF

        curl -fsSL -X POST -H 'Content-Type: application/json' -d "@${PAYLOAD}" "${WEBHOOK_URL}"
        echo "notified=true" >> "${GITHUB_OUTPUT}"
