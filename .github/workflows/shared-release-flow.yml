---
name: "Shared: Release Flow"

on:
  workflow_call:
    inputs:
      release-type:
        description: "release-please release type (simple, node, java, python, etc.)"
        type: string
        default: "simple"
      config-file:
        description: "release-please config file path"
        type: string
        default: ".release-please-config.json"
      manifest-file:
        description: "release-please manifest file path"
        type: string
        default: ".release-please-manifest.json"
    secrets:
      APP_ID:
        description: "GitHub App ID for release automation (needs contents: write, pull-requests: write)"
        required: true
      APP_PRIVATE_KEY:
        description: "GitHub App private key (PEM) for release automation"
        required: true
      RELEASE_GPG_PRIVATE_KEY:
        description: "GPG private key for signing release tags"
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run release-please
        id: release
        uses: google-github-actions/release-please-action@e4dc86ba9405554aeba3c6bb2d169500e7d3b4ee # v4.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: ${{ inputs.release-type }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

  sign-tag:
    name: Sign release tag
    needs: release
    if: ${{ needs.release.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
    steps:
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Import GPG key
        id: import-gpg
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}
          passphrase: ""
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: false

      - name: Sign and push release tag
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        run: |
          TAG="${{ needs.release.outputs.tag_name }}"
          test -n "${TAG}"
          git tag -f -s -m "${TAG}" "${TAG}"
          git push -f origin "refs/tags/${TAG}"

      - name: Skip tag signing (no GPG key configured)
        if: ${{ env.GPG_PRIVATE_KEY == '' }}
        run: echo "::warning::RELEASE_GPG_PRIVATE_KEY not set; release tag left unsigned."
