---
name: "Shared: Service Promote"

on:
  workflow_call:
    inputs:
      environment:
        description: "Target deploy ref to move (dev or qa)"
        type: string
        required: true
      service:
        description: "Service name (used for concurrency and messages)"
        type: string
        required: true
      commit:
        description: "Commit SHA to promote; defaults to the triggering commit"
        type: string
        default: ""
      run-publish:
        description: "Build and push a Docker image for the promoted commit"
        type: boolean
        default: false
      image:
        description: "Container image name without tag (required when run-publish)"
        type: string
        default: ""
      publish-tag:
        description: "Container image tag to publish (defaults to sha-<commit>)"
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        default: "Dockerfile"
      context:
        description: "Docker build context"
        type: string
        default: "."
      platforms:
        description: "Comma-separated build platforms"
        type: string
        default: "linux/amd64"
      dry-run:
        description: "Report the ref move without pushing"
        type: boolean
        default: false
    secrets:
      APP_ID:
        description: "Deploy-bot GitHub App ID (contents: write on the service repo)"
        required: true
      APP_PRIVATE_KEY:
        description: "Deploy-bot GitHub App private key (PEM)"
        required: true

permissions:
  contents: read

concurrency:
  group: service-promote-${{ inputs.service }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.environment }}
    runs-on: ubuntu-latest
    outputs:
      pushed-commit: ${{ steps.push.outputs.pushed-commit }}
      updated: ${{ steps.push.outputs.updated }}
    steps:
      - name: Mint deploy-bot token
        id: app-token
        uses: sca-templates/CI-CD-Templates/.github/actions/mint-app-token@66755baa61ec4d5134e0f63f693bcff8722c1759
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve target commit
        id: resolve
        shell: bash
        env:
          commit_input: ${{ inputs.commit }}
          default_commit: ${{ github.sha }}
        run: |
          set -euo pipefail
          COMMIT="$commit_input"
          [ -n "$COMMIT" ] || COMMIT="$default_commit"
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit '$COMMIT' is not a full commit SHA"
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Push deploy ref
        id: push
        shell: bash
        env:
          environment: ${{ inputs.environment }}
          service: ${{ inputs.service }}
          commit: ${{ steps.resolve.outputs.commit }}
          dry_run: ${{ inputs.dry-run }}
          repo: ${{ github.repository }}
          bot_token: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          case "$environment" in
            dev|qa) ;;
            *) echo "::error::environment must be dev or qa (got '$environment')"; exit 1 ;;
          esac

          git fetch --no-tags --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
            echo "::error::commit $commit is not present in $repo"
            exit 1
          fi

          REF="refs/heads/deploy/${environment}"
          echo "pushed-commit=$commit" >> "$GITHUB_OUTPUT"

          if [ "$dry_run" = "true" ]; then
            echo "::warning::dry-run — would force-push $commit to $REF"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -c "http.extraHeader=Authorization: Bearer ${bot_token}" push --force \
            "https://github.com/${repo}.git" "${commit}:${REF}"
          echo "Pointed $REF at $commit"
          echo "updated=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish Docker image
    needs: promote
    if: ${{ inputs.run-publish && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate image name
        shell: bash
        env:
          image: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if [ -z "$image" ]; then
            echo "::error::image is required when run-publish is true"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.promote.outputs.pushed-commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.image }}:${{ inputs.publish-tag || format('sha-{0}', needs.promote.outputs.pushed-commit) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
