---
name: "Shared: Service Promote"

# Action references below are full cross-repo refs pinned to v3.3.0, deliberately
# NOT `uses: ./…`. Inside a reusable workflow a `./` path resolves against the
# *calling* repository, so it only resolves for callers inside CI-CD-Templates and
# fails everywhere else with "Can't find 'action.yml' … under <checkout>/.github/actions/…".
# Note the contrast with the `self-*.yml` workflows, which call `shared-*`/`stack-*` with
# local `./.github/workflows/…` refs: that is correct, because `self-*` are not reusable
# and always execute in their own repository.

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev or qa); runs against the matching GitHub Environment"
        type: string
        required: true
      service:
        description: "Service name (also the ApplicationSet element name; used for concurrency and messages)"
        type: string
        required: true
      app:
        description: "ArgoCD Application name to sync (defaults to <service>-<environment>)"
        type: string
        required: false
        default: ""
      revision:
        description: "Branch, tag or commit to deploy; defaults to the head of main"
        type: string
        default: "main"
      run-publish:
        description: "Build and push a Docker image for the promoted commit"
        type: boolean
        default: false
      image:
        description: "Container image name without tag (required when run-publish)"
        type: string
        default: ""
      publish-tag:
        description: "Container image tag to publish (defaults to sha-<commit>)"
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        default: "Dockerfile"
      context:
        description: "Docker build context"
        type: string
        default: "."
      platforms:
        description: "Comma-separated build platforms"
        type: string
        default: "linux/amd64"
      dry-run:
        description: "Report the revision and app without syncing"
        type: boolean
        default: false
      prune:
        description: "Pass --prune to the app sync; qa defaults to false per ADR-003"
        type: boolean
        default: ${{ inputs.environment != 'qa' }}
    secrets:
      ARGOCD_SERVER:
        description: "ArgoCD API server URL (injected from the job's dev/qa environment)"
        required: false
      ARGOCD_TOKEN:
        description: "ArgoCD API token for a scoped role (sync/get on this service's dev/qa apps)"
        required: false

permissions:
  contents: read

concurrency:
  group: service-promote-${{ inputs.service }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.environment }}
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: ${{ inputs.environment }}
    env:
      APP: ${{ inputs.app || format('{0}-{1}', inputs.service, inputs.environment) }}
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Resolve revision to commit
        id: resolve
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          REV="${REVISION:-main}"
          URL="https://github.com/${REPO}.git"
          BRANCH_SHA="$(git ls-remote "${URL}" "refs/heads/${REV}" | awk '{print $1}' | head -n1 || true)"
          if [ -n "${BRANCH_SHA}" ]; then
            echo "commit=${BRANCH_SHA}" >> "$GITHUB_OUTPUT"
            echo "Resolved ${REV} -> ${BRANCH_SHA}"
            exit 0
          fi
          TAG_SHA="$(git ls-remote "${URL}" "refs/tags/${REV}" "refs/tags/${REV}^{}" | awk '{print $1}' | head -n1 || true)"
          if [ -n "${TAG_SHA}" ]; then
            echo "commit=${TAG_SHA}" >> "$GITHUB_OUTPUT"
            echo "Resolved ${REV} -> ${TAG_SHA}"
            exit 0
          fi
          echo "::error::revision '${REV}' does not resolve to a branch or tag in ${REPO}"
          exit 1

      - name: Report dry-run
        if: ${{ inputs.dry-run }}
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          echo "::warning::dry-run — would sync ${APP} to ${REVISION} (${COMMIT})"

      - name: Sync ArgoCD app
        if: ${{ !inputs.dry-run }}
        uses: sca-templates/CI-CD-Templates/.github/actions/argocd-app-sync@144996d6e0870c6820ac02a7835faef217f9c2d4 # v3.3.0
        with:
          server: ${{ secrets.ARGOCD_SERVER || vars.ARGOCD_SERVER }}
          token: ${{ secrets.ARGOCD_TOKEN }}
          app: ${{ env.APP }}
          revision: ${{ steps.resolve.outputs.commit }}
          prune: ${{ inputs.prune }}
          timeout: '300'

  publish:
    name: Publish Docker image
    needs: promote
    if: ${{ inputs.run-publish && !inputs.dry-run }}
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate image name
        shell: bash
        env:
          image: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if [ -z "$image" ]; then
            echo "::error::image is required when run-publish is true"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.promote.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.image }}:${{ inputs.publish-tag || format('sha-{0}', needs.promote.outputs.commit) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
