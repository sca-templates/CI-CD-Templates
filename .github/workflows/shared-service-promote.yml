---
name: "Shared: Service Promote"

on:
  workflow_call:
    inputs:
      environment:
        description: "Target deploy ref to move (dev or qa)"
        type: string
        required: true
      service:
        description: "Service name (used for concurrency and messages)"
        type: string
        required: true
      ref:
        description: "Git ref (branch or tag) to promote; takes precedence over commit and defaults to the triggering commit"
        type: string
        default: ""
      commit:
        description: "Commit SHA to promote; ignored when ref is set, defaults to the triggering commit"
        type: string
        default: ""
      run-publish:
        description: "Build and push a Docker image for the promoted commit"
        type: boolean
        default: false
      image:
        description: "Container image name without tag (required when run-publish)"
        type: string
        default: ""
      publish-tag:
        description: "Container image tag to publish (defaults to sha-<commit>)"
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        default: "Dockerfile"
      context:
        description: "Docker build context"
        type: string
        default: "."
      platforms:
        description: "Comma-separated build platforms"
        type: string
        default: "linux/amd64"
      dry-run:
        description: "Report the ref move without pushing"
        type: boolean
        default: false
    secrets:
      APP_ID:
        description: "Deploy-bot GitHub App ID (contents: write on the service repo)"
        required: true
      APP_PRIVATE_KEY:
        description: "Deploy-bot GitHub App private key (PEM)"
        required: true

permissions:
  contents: read

concurrency:
  group: service-promote-${{ inputs.service }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.environment }} (direct)
    if: ${{ !(inputs.environment == 'qa' && inputs.dry-run == 'false') }}
    runs-on: ubuntu-latest
    outputs:
      pushed-commit: ${{ steps.push.outputs.pushed-commit }}
      updated: ${{ steps.push.outputs.updated }}
    steps:
      - name: Push deploy ref
        id: push
        uses: sca-templates/CI-CD-Templates/.github/actions/push-deploy-ref@d44e3cc4c907d9cf90ab1375640582d655fd3b70
        with:
          environment: ${{ inputs.environment }}
          service: ${{ inputs.service }}
          ref: ${{ inputs.ref }}
          commit: ${{ inputs.commit }}
          default-commit: ${{ github.sha }}
          dry-run: ${{ inputs.dry-run }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          github-repository: ${{ github.repository }}

  promote-qa:
    name: Promote qa (requires approval)
    if: ${{ inputs.environment == 'qa' && inputs.dry-run == 'false' }}
    runs-on: ubuntu-latest
    environment: qa
    outputs:
      pushed-commit: ${{ steps.push.outputs.pushed-commit }}
      updated: ${{ steps.push.outputs.updated }}
    steps:
      - name: Push deploy ref
        id: push
        uses: sca-templates/CI-CD-Templates/.github/actions/push-deploy-ref@d44e3cc4c907d9cf90ab1375640582d655fd3b70
        with:
          environment: ${{ inputs.environment }}
          service: ${{ inputs.service }}
          ref: ${{ inputs.ref }}
          commit: ${{ inputs.commit }}
          default-commit: ${{ github.sha }}
          dry-run: ${{ inputs.dry-run }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          github-repository: ${{ github.repository }}

  publish:
    name: Publish Docker image
    needs: [promote, promote-qa]
    if: ${{ inputs.run-publish && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate image name
        shell: bash
        env:
          image: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if [ -z "$image" ]; then
            echo "::error::image is required when run-publish is true"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.promote.outputs.pushed-commit || needs['promote-qa'].outputs.pushed-commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.image }}:${{ inputs.publish-tag || format('sha-{0}', needs.promote.outputs.pushed-commit || needs['promote-qa'].outputs.pushed-commit) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
