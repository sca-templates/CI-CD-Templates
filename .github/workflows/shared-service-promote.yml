---
name: "Shared: Service Promote"

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev or qa); runs against the matching GitHub Environment"
        type: string
        required: true
      service:
        description: "Service name (also the ApplicationSet element name; used for concurrency and messages)"
        type: string
        required: true
      app:
        description: "ArgoCD Application name to sync (defaults to <service>-<environment>)"
        type: string
        required: false
        default: ""
      revision:
        description: "Branch, tag or commit to deploy; defaults to the head of main"
        type: string
        default: "main"
      run-publish:
        description: "Build and push a Docker image for the promoted commit"
        type: boolean
        default: false
      image:
        description: "Container image name without tag (required when run-publish)"
        type: string
        default: ""
      publish-tag:
        description: "Container image tag to publish (defaults to sha-<commit>)"
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        default: "Dockerfile"
      context:
        description: "Docker build context"
        type: string
        default: "."
      platforms:
        description: "Comma-separated build platforms"
        type: string
        default: "linux/amd64"
      dry-run:
        description: "Report the revision and app without syncing"
        type: boolean
        default: false
    secrets:
      ARGOCD_SERVER:
        description: "ArgoCD API server URL (injected from the job's dev/qa environment)"
        required: false
      ARGOCD_TOKEN:
        description: "ArgoCD API token for a scoped role (sync/get on this service's dev/qa apps)"
        required: false

permissions:
  contents: read

concurrency:
  group: service-promote-${{ inputs.service }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      APP: ${{ inputs.app || format('{0}-{1}', inputs.service, inputs.environment) }}
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Resolve revision to commit
        id: resolve
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          REV="${REVISION:-main}"
          URL="https://github.com/${REPO}.git"
          BRANCH_SHA="$(git ls-remote "${URL}" "refs/heads/${REV}" | awk '{print $1}' | head -n1 || true)"
          if [ -n "${BRANCH_SHA}" ]; then
            echo "commit=${BRANCH_SHA}" >> "$GITHUB_OUTPUT"
            echo "Resolved ${REV} -> ${BRANCH_SHA}"
            exit 0
          fi
          TAG_SHA="$(git ls-remote "${URL}" "refs/tags/${REV}" "refs/tags/${REV}^{}" | awk '{print $1}' | head -n1 || true)"
          if [ -n "${TAG_SHA}" ]; then
            echo "commit=${TAG_SHA}" >> "$GITHUB_OUTPUT"
            echo "Resolved ${REV} -> ${TAG_SHA}"
            exit 0
          fi
          echo "::error::revision '${REV}' does not resolve to a branch or tag in ${REPO}"
          exit 1

      - name: Report dry-run
        if: ${{ inputs.dry-run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          REV="${{ inputs.revision }}"
          echo "::warning::dry-run — would sync ${APP} to ${REV} (${{ steps.resolve.outputs.commit }})"

      - name: Sync ArgoCD app
        if: ${{ inputs.dry-run != 'true' }}
        uses: ./.github/actions/argocd-app-sync
        with:
          server: ${{ secrets.ARGOCD_SERVER }}
          token: ${{ secrets.ARGOCD_TOKEN }}
          app: ${{ env.APP }}
          revision: ${{ steps.resolve.outputs.commit }}
          prune: 'true'
          timeout: '300'

  publish:
    name: Publish Docker image
    needs: promote
    if: ${{ inputs.run-publish == 'true' && inputs.dry-run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate image name
        shell: bash
        env:
          image: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if [ -z "$image" ]; then
            echo "::error::image is required when run-publish is true"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.promote.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.image }}:${{ inputs.publish-tag || format('sha-{0}', needs.promote.outputs.commit) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max