---
name: "Shared: Static Validation"

on:
  workflow_call:
    inputs:
      markdown-lint:
        description: "Run markdownlint"
        type: boolean
        default: true
      yaml-lint:
        description: "Run yamllint"
        type: boolean
        default: true
      shell-lint:
        description: "Run bash -n syntax check"
        type: boolean
        default: true
      actionlint:
        description: "Run actionlint on workflows"
        type: boolean
        default: true
      node-version:
        description: "Node.js version for markdownlint"
        type: string
        default: "22"
      python-version:
        description: "Python version for yamllint"
        type: string
        default: "3.x"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown
    if: ${{ inputs.markdown-lint }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

      - name: markdown-link-check
        run: |
          status=0
          while IFS= read -r -d '' f; do
            npx --yes markdown-link-check@3.15.0 --config .markdown-link-check.json "$f" || status=1
          done < <(find . -name '*.md' -not -path './node_modules/*' -not -path './.opencode/*' -not -path './.claude/*' -print0)
          exit "$status"

  yaml-shell:
    name: YAML and Shell
    if: ${{ inputs.yaml-lint || inputs.shell-lint }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ inputs.yaml-lint }}
        with:
          python-version: ${{ inputs.python-version }}

      - name: yamllint
        if: ${{ inputs.yaml-lint }}
        run: |
          curl -fsSL -o yamllint-1.38.0-py3-none-any.whl https://files.pythonhosted.org/packages/05/92/aed08e68de6e6a3d7c2328ce7388072cd6affc26e2917197430b646aed02/yamllint-1.38.0-py3-none-any.whl
          echo 'fc394a5b3be980a4062607b8fdddc0843f4fa394152b6da21722f5d59013c220  yamllint-1.38.0-py3-none-any.whl' | sha256sum -c -
          pip install --disable-pip-version-check yamllint-1.38.0-py3-none-any.whl
          yamllint -c .yamllint.yaml .

      - name: bash -n
        if: ${{ inputs.shell-lint }}
        run: |
          status=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || status=1
          done < <(find . -name '*.sh' -not -path './node_modules/*' -print0)
          exit "$status"

  template-tests:
    name: Test templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test template invariants
        run: ./scripts/test-templates.sh

  actionlint-job:
    name: Analyze (GitHub Actions)
    if: ${{ inputs.actionlint }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION="v1.7.12"
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_1.7.12_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" /tmp/actionlint.tar.gz | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: actionlint
        run: actionlint -color
