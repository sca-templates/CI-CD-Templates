---
name: "Self: Service Promote"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to smoke-test (dev or qa)"
        type: choice
        options: [dev, qa]
        default: dev
      service:
        description: "Service name to smoke-test"
        type: string
        default: CI-CD-Templates
      branch:
        description: "Branch or tag to smoke-test"
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: self-service-promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    name: Service Promote (dry-run)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/shared-service-promote.yml
    with:
      environment: ${{ inputs.environment }}
      service: ${{ inputs.service }}
      revision: ${{ inputs.branch }}
      dry-run: true
    secrets: inherit
