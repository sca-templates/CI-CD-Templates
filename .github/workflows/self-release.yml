---
name: "Self: Release"

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/shared-release-flow.yml
    with:
      release-type: "simple"
    secrets: inherit
