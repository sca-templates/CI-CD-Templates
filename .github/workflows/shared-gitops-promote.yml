---
name: "Shared: GitOps Promote"

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev, qa or prod)
        type: string
        required: true
      service:
        description: Service name; maps to envs/<environment>/<service>.yaml unless manifest-path is set
        type: string
        required: true
      image-tag:
        description: Container image tag to promote
        type: string
        required: true
      gitops-repo:
        description: GitOps repository (owner/repo) to update
        type: string
        default: "sca-templates/infra-kubernetes"
      base-branch:
        description: Base branch of the GitOps repository
        type: string
        default: "main"
      manifest-path:
        description: Overrides envs/<environment>/<service>.yaml
        type: string
        default: ""
      mode:
        description: "commit (direct push) or pr (pull request); defaults to commit for dev/qa and pr for prod"
        type: string
        default: ""
      skip-release-gate:
        description: Bypass the prod gate requiring an open release-please PR
        type: boolean
        default: false
      dry-run:
        description: Report planned change without committing
        type: boolean
        default: false
    secrets:
      APP_ID:
        description: GitHub App ID with access to the GitOps and service repositories
        required: true
      APP_PRIVATE_KEY:
        description: GitHub App private key (PEM)
        required: true

  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options:
          - dev
          - qa
          - prod
      service:
        description: Service name; maps to envs/<environment>/<service>.yaml
        type: string
        required: true
      image-tag:
        description: Container image tag to promote
        type: string
        required: true
      gitops-repo:
        description: GitOps repository (owner/repo) to update
        type: string
        default: "sca-templates/infra-kubernetes"
      base-branch:
        description: Base branch of the GitOps repository
        type: string
        default: "main"
      manifest-path:
        description: Overrides envs/<environment>/<service>.yaml
        type: string
        default: ""
      mode:
        description: "commit (direct push) or pr (pull request); empty defaults to commit for dev/qa and pr for prod"
        type: string
        default: ""
      skip-release-gate:
        description: Bypass the prod gate requiring an open release-please PR
        type: boolean
        default: false
      dry-run:
        description: Report planned change without committing
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gitops-promote-${{ inputs.environment }}-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Mint release bot token
        id: app-token
        uses: sca-templates/CI-CD-Templates/.github/actions/mint-app-token@66755baa61ec4d5134e0f63f693bcff8722c1759
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "${{ github.repository }},${{ inputs.gitops-repo }}"

      - name: Require open release PR before promoting to prod
        if: ${{ inputs.environment == 'prod' && !inputs.skip-release-gate }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PRS="$(gh pr list --repo "${{ github.repository }}" --state open \
            --json title \
            --jq '[.[] | select(.title | startswith("chore(") and contains("release"))] | length')"
          if [ "${PRS}" -eq 0 ]; then
            echo "::error::No open release-please PR in ${{ github.repository }}."
            echo "::error::Prod promotion requires an approved PR and an open release cycle. Set skip-release-gate to override."
            exit 1
          fi
          echo "Open release PR found — prod promotion allowed."

      - name: Promote image tag
        id: bump
        uses: sca-templates/CI-CD-Templates/.github/actions/gitops-bump-image@66755baa61ec4d5134e0f63f693bcff8722c1759
        with:
          environment: ${{ inputs.environment }}
          service: ${{ inputs.service }}
          image-tag: ${{ inputs.image-tag }}
          gitops-repo: ${{ inputs.gitops-repo }}
          base-branch: ${{ inputs.base-branch }}
          manifest-path: ${{ inputs.manifest-path }}
          mode: ${{ inputs.mode || (inputs.environment == 'prod' && 'pr' || 'commit') }}
          dry-run: ${{ inputs.dry-run }}
          bot-token: ${{ steps.app-token.outputs.token }}

      - name: Report promotion result
        if: always()
        run: |
          echo "Updated: ${{ steps.bump.outputs.updated }}"
          [ -n "${{ steps.bump.outputs.commit-sha }}" ] && echo "Commit: ${{ steps.bump.outputs.commit-sha }}"
          [ -n "${{ steps.bump.outputs.pr-url }}" ] && echo "PR: ${{ steps.bump.outputs.pr-url }}"
