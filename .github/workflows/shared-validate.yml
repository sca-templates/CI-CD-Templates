---
name: "Shared: Validate"

# Repository-hygiene checks extracted from infra-kubernetes' local validate.yml:
# markdown linting and link checking, YAML + shell syntax, and actionlint. Each
# job is opt-in so a consumer can adopt only what it needs; technology-specific
# manifest validation (kubeconform/helm/kube-linter) stays in the consumer.
on:
  workflow_call:
    inputs:
      markdown:
        description: "Run markdownlint over markdown-glob"
        type: boolean
        default: true
      markdown-glob:
        description: "Glob passed to markdownlint-cli2"
        type: string
        default: "**/*.md"
      markdown-links:
        description: "Run markdown-link-check over markdown-link-paths"
        type: boolean
        default: true
      markdown-link-config:
        description: "Path to the markdown-link-check config"
        type: string
        default: ".github/markdown-link-check.json"
      markdown-link-paths:
        description: "Space-separated files/directories whose Markdown links are checked"
        type: string
        default: "README.md docs .github"
      yaml:
        description: "Run yamllint and bash -n"
        type: boolean
        default: true
      yaml-config:
        description: "Path to the yamllint config"
        type: string
        default: ".yamllint.yaml"
      yaml-requirements:
        description: "Path to a hash-pinned requirements file used to install yamllint"
        type: string
        default: ".github/requirements-yamllint.txt"
      shell-glob:
        description: "Glob of shell scripts checked with bash -n"
        type: string
        default: "bootstrap/*.sh"
      actionlint:
        description: "Run actionlint over the workflows"
        type: boolean
        default: true
      node-version:
        description: "Node.js version used by the Markdown job"
        type: string
        default: "22"

permissions:
  contents: read

concurrency:
  group: shared-validate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown
    if: ${{ inputs.markdown }}
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: markdownlint
        env:
          GLOB: ${{ inputs.markdown-glob }}
        run: npx --yes markdownlint-cli2 "${GLOB}"

      - name: Markdown links
        if: ${{ inputs.markdown-links }}
        env:
          CONFIG: ${{ inputs.markdown-link-config }}
          PATHS: ${{ inputs.markdown-link-paths }}
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            npx --yes markdown-link-check -c "${CONFIG}" "$f" || status=1
          done < <(
            for p in ${PATHS}; do
              if [ -f "$p" ]; then
                printf '%s\n' "$p"
              elif [ -d "$p" ]; then
                find "$p" -name '*.md' -type f
              fi
            done | sort -u
          )
          exit "$status"

  yaml:
    name: YAML and Shell
    if: ${{ inputs.yaml }}
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install yamllint (pinned, verified)
        env:
          REQUIREMENTS: ${{ inputs.yaml-requirements }}
        run: python -m pip install --disable-pip-version-check --require-hashes -r "${REQUIREMENTS}"

      - name: yamllint
        env:
          CONFIG: ${{ inputs.yaml-config }}
        run: yamllint -c "${CONFIG}" .

      - name: Shell syntax
        env:
          GLOB: ${{ inputs.shell-glob }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( ${GLOB} )
          if [ "${#files[@]}" -gt 0 ]; then
            bash -n "${files[@]}"
          else
            echo "No shell scripts matched '${GLOB}'; nothing to check."
          fi

  actionlint:
    name: Workflow lint (actionlint)
    if: ${{ inputs.actionlint }}
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint (pinned, verified)
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="v1.7.12"
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_1.7.12_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" /tmp/actionlint.tar.gz | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 /tmp/actionlint "$RUNNER_TEMP/bin/actionlint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          actionlint -version

      - name: Lint GitHub Actions workflows
        run: actionlint -color
