---
name: "Shared: DAST (OWASP ZAP)"

on:
  workflow_call:
    inputs:
      target-url:
        description: "Base URL of the running service to scan"
        type: string
        required: false
      scan-type:
        description: "Scan type: baseline (quick) or full"
        type: string
        default: "baseline"
      fail-on-alerts:
        description: "Fail the job when ZAP reports alerts"
        type: boolean
        default: false
      cmd-options:
        description: "Extra zap.sh command line options"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: dast-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  zap:
    name: ZAP ${{ inputs.scan-type }} scan
    if: ${{ inputs.target-url != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ZAP full scan
        if: ${{ inputs.scan-type == 'full' }}
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ inputs.target-url }}
          cmd_options: ${{ inputs.cmd-options }}
          fail_action: ${{ inputs.fail-on-alerts }}
          allow_issue_writing: false
          sarif_file: zap.sarif

      - name: Run ZAP baseline scan
        if: ${{ inputs.scan-type != 'full' }}
        uses: zaproxy/action-baseline@41aee98ebc7cf2802c3beae4e7d4336413a21e43 # v0.9.0
        with:
          target: ${{ inputs.target-url }}
          cmd_options: ${{ inputs.cmd-options }}
          fail_action: ${{ inputs.fail-on-alerts }}
          allow_issue_writing: false
          sarif_file: zap.sarif

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: zap.sarif
          category: dast-zap

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-reports
          path: reports
          if-no-files-found: ignore