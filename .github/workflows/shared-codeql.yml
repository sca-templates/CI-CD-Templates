---
name: "Shared: CodeQL"

on:
  workflow_call:
    inputs:
      languages:
        description: "CodeQL languages to analyze (JSON array string)"
        type: string
        default: '["actions"]'
      schedule:
        description: "Enable weekly schedule trigger"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(inputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:${{ matrix.language }}"
