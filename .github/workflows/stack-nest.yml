---
name: "Stack: Nest"

# Action references below are full cross-repo refs pinned to v3.3.0, deliberately
# NOT `uses: ./…`. Inside a reusable workflow a `./` path resolves against the
# *calling* repository, so it only resolves for callers inside CI-CD-Templates and
# fails everywhere else with "Can't find 'action.yml' … under <checkout>/.github/actions/…".
# Note the contrast with the `self-*.yml` workflows, which call `shared-*`/`stack-*` with
# local `./.github/workflows/…` refs: that is correct, because `self-*` are not reusable
# and always execute in their own repository.

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        type: string
        default: "22"
      working-directory:
        description: "Directory containing package.json"
        type: string
        default: "."
      package-manager:
        description: "Package manager used by the project: npm or pnpm"
        type: string
        default: "npm"
      pnpm-version:
        description: "pnpm version to install when package-manager is pnpm; keep it in sync with the packageManager field in package.json"
        type: string
        default: "10"
      run-lint:
        description: "Run the linter (npm run lint)"
        type: boolean
        default: true
      run-format:
        description: "Run the format check (npm run format:check)"
        type: boolean
        default: true
      run-test:
        description: "Run the test suite (npm run test:ci)"
        type: boolean
        default: true
      run-build:
        description: "Run the build step (npm run build)"
        type: boolean
        default: true
      run-publish:
        description: "Build and push a Docker image to the container registry"
        type: boolean
        default: false
      image:
        description: "Container image name without tag (e.g. ghcr.io/sca-templates/sca-api)"
        type: string
        default: ""
      publish-tag:
        description: "Container image tag to publish (defaults to sha-<commit>)"
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        default: "Dockerfile"
      context:
        description: "Docker build context"
        type: string
        default: "."
      platforms:
        description: "Comma-separated build platforms"
        type: string
        default: "linux/amd64"

permissions:
  contents: read

concurrency:
  group: stack-nest-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    if: ${{ inputs.run-lint }}
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the project
        uses: sca-templates/CI-CD-Templates/.github/actions/setup-node-project@144996d6e0870c6820ac02a7835faef217f9c2d4 # v3.3.0
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: Lint
        run: npm run lint
        working-directory: ${{ inputs.working-directory }}

  format:
    name: Format
    if: ${{ inputs.run-format }}
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the project
        uses: sca-templates/CI-CD-Templates/.github/actions/setup-node-project@144996d6e0870c6820ac02a7835faef217f9c2d4 # v3.3.0
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: Format
        run: npm run format:check
        working-directory: ${{ inputs.working-directory }}

  test:
    name: Test
    if: ${{ inputs.run-test }}
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the project
        uses: sca-templates/CI-CD-Templates/.github/actions/setup-node-project@144996d6e0870c6820ac02a7835faef217f9c2d4 # v3.3.0
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: Test
        run: npm run test:ci
        working-directory: ${{ inputs.working-directory }}

  build:
    name: Build
    if: ${{ inputs.run-build }}
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the project
        uses: sca-templates/CI-CD-Templates/.github/actions/setup-node-project@144996d6e0870c6820ac02a7835faef217f9c2d4 # v3.3.0
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: Build
        run: npm run build
        working-directory: ${{ inputs.working-directory }}

  publish:
    name: Publish Docker image
    if: ${{ inputs.run-publish }}
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the project
        uses: sca-templates/CI-CD-Templates/.github/actions/setup-node-project@144996d6e0870c6820ac02a7835faef217f9c2d4 # v3.3.0
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: Build
        run: npm run build
        working-directory: ${{ inputs.working-directory }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.image }}:${{ inputs.publish-tag || format('sha-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
