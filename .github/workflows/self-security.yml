---
name: "Self: Security"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "13 8 * * 1"

permissions:
  contents: read

concurrency:
  group: self-security-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/shared-security-scan.yml
    with:
      gitleaks: true
      osv-scan: true

  codeql:
    name: Analyze (GitHub Actions)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/shared-codeql.yml
    with:
      languages: '["actions"]'
