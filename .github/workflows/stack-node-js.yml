---
name: "Stack: Node.js"

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        type: string
        default: "22"
      working-directory:
        description: "Directory containing package.json"
        type: string
        default: "."
      run-lint:
        description: "Run the linter (npm run lint)"
        type: boolean
        default: true
      run-format:
        description: "Run the format check (npm run format:check)"
        type: boolean
        default: false
      run-test:
        description: "Run the test suite (npm run test:ci)"
        type: boolean
        default: true
      run-build:
        description: "Run the build step (npm run build)"
        type: boolean
        default: false
      run-publish:
        description: "Build and push a Docker image to the container registry"
        type: boolean
        default: false
      image:
        description: "Container image name without tag (e.g. ghcr.io/sca-templates/sca-api)"
        type: string
        default: ""
      publish-tag:
        description: "Container image tag to publish (defaults to sha-<commit>)"
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        default: "Dockerfile"
      context:
        description: "Docker build context"
        type: string
        default: "."
      platforms:
        description: "Comma-separated build platforms"
        type: string
        default: "linux/amd64"

permissions:
  contents: read

concurrency:
  group: stack-node-js-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    if: ${{ inputs.run-lint }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ inputs.working-directory }}

      - name: Lint
        run: npm run lint
        working-directory: ${{ inputs.working-directory }}

  format:
    name: Format
    if: ${{ inputs.run-format }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ inputs.working-directory }}

      - name: Format
        run: npm run format:check
        working-directory: ${{ inputs.working-directory }}

  test:
    name: Test
    if: ${{ inputs.run-test }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ inputs.working-directory }}

      - name: Test
        run: npm run test:ci
        working-directory: ${{ inputs.working-directory }}

  build:
    name: Build
    if: ${{ inputs.run-build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ inputs.working-directory }}

      - name: Build
        run: npm run build
        working-directory: ${{ inputs.working-directory }}

  publish:
    name: Publish Docker image
    if: ${{ inputs.run-publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ inputs.working-directory }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.image }}:${{ inputs.publish-tag || format('sha-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max