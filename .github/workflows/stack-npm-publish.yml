---
name: "Stack: NPM Publish"

# npm publishing extracted from node-server-core's local publish.yml. A reusable
# workflow cannot itself trigger on `release`/`workflow_dispatch`, so consumers
# keep a thin caller that maps those events and passes `tag` / `dry-run`.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to publish, with or without the leading 'v'; falls back to the release event tag"
        type: string
        default: ""
      dry-run:
        description: "Build the tarball and print it without contacting npm's write API"
        type: boolean
        default: false
      node-version:
        description: "Node.js version"
        type: string
        default: "22"
      package-manager:
        description: "Package manager that owns the lockfile: pnpm or npm"
        type: string
        default: "pnpm"
      pnpm-version:
        description: "pnpm version to install when package-manager is pnpm"
        type: string
        default: "10"
      working-directory:
        description: "Directory containing package.json"
        type: string
        default: "."
      registry-url:
        description: "npm registry URL written to .npmrc (reads NODE_AUTH_TOKEN)"
        type: string
        default: "https://registry.npmjs.org"
      access:
        description: "npm access level passed to publish (public or restricted)"
        type: string
        default: "public"
      verify-tag-version:
        description: "Fail when the tag does not match the package.json version"
        type: boolean
        default: true
    secrets:
      NPM_TOKEN:
        description: "npm automation token with publish rights on the scope; must be non-empty"
        required: true

permissions:
  contents: read

# The org shares one self-hosted runner, so two publishes must not overlap on
# the same machine.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Resolve tag
        id: target
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-${RELEASE_TAG}}"
          if [ -z "${tag}" ]; then
            echo "::error::no tag to publish; pass 'tag' or trigger from a release event"
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.tag }}
          fetch-depth: 0

      - name: Set up pnpm
        if: ${{ inputs.package-manager == 'pnpm' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        env:
          PM: ${{ inputs.package-manager }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "::error::package-manager must be pnpm or npm (got '$PM')"; exit 1 ;;
          esac

      - name: Verify the tag matches the manifest version
        if: ${{ inputs.verify-tag-version }}
        env:
          TAG: ${{ steps.target.outputs.tag }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          version="$(node --input-type=commonjs -p "require('./package.json').version")"
          expected="${TAG#v}"
          if [ "${version}" != "${expected}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi
          echo "Tag ${TAG} matches package.json version ${version}"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
          PM: ${{ inputs.package-manager }}
          ACCESS: ${{ inputs.access }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          # An org secret whose visibility does not cover this repository resolves
          # to an empty string instead of failing, and the 401 only shows up here.
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN resolved to an empty value; check the secret's repository visibility in the organization settings"
            exit 1
          fi
          args=(--access "${ACCESS}")
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run: the tarball will be built but not sent to npm"
            args+=(--dry-run)
          fi
          case "$PM" in
            pnpm)
              # A tag checkout is a detached HEAD, which pnpm refuses to publish
              # from unless git checks are disabled.
              pnpm publish --no-git-checks "${args[@]}"
              ;;
            npm)
              npm publish "${args[@]}"
              ;;
            *)
              echo "::error::package-manager must be pnpm or npm (got '$PM')"
              exit 1
              ;;
          esac
