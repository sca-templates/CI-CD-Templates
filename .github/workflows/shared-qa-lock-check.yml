---
name: "Shared: QA Lock Check"

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: release-gate
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Check for open release-please PRs
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          RELEASE_PR=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${DEFAULT_BRANCH}" \
            --state open \
            --json headRefName,title \
            --jq '.[] | select(.title | startswith("chore(") and contains("release")) | .headRefName')

          if [ -z "${RELEASE_PR}" ]; then
            echo "No release-please PR found — merge allowed."
            exit 0
          fi

          if [ "${CURRENT_BRANCH}" = "${RELEASE_PR}" ]; then
            echo "Current PR IS the release-please PR — merge allowed."
            exit 0
          fi

          echo "::error::A release-please PR (${RELEASE_PR}) is open on the default branch."
          echo "Merge or close it before merging other PRs."
          exit 1
