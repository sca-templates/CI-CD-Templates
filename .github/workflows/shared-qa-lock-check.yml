---
name: "Shared: QA Lock Check"

on:
  workflow_call:
    inputs:
      exempt-bots:
        description: "Pass when the PR was opened by a bot actor (dependabot, renovate, *[bot])"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: release-gate
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Check for open release-please PRs
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
          EXEMPT_BOTS: ${{ inputs.exempt-bots }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          # Bots cut their own PRs (dependency bumps, release-please) and cannot
          # rebase behind an open release PR, so blocking them would deadlock the
          # queue.
          if [ "${EXEMPT_BOTS}" = "true" ]; then
            case "${ACTOR}" in
              *"[bot]"|dependabot*|renovate*)
                echo "Actor ${ACTOR} is a bot — merge allowed."
                exit 0
                ;;
            esac
          fi

          RELEASE_PR=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${DEFAULT_BRANCH}" \
            --state open \
            --json headRefName,title \
            --jq '.[] | select(.title | startswith("chore(") and contains("release")) | .headRefName')

          if [ -z "${RELEASE_PR}" ]; then
            echo "No release-please PR found — merge allowed."
            exit 0
          fi

          if [ "${CURRENT_BRANCH}" = "${RELEASE_PR}" ]; then
            echo "Current PR IS the release-please PR — merge allowed."
            exit 0
          fi

          echo "::error::A release-please PR (${RELEASE_PR}) is open on the default branch."
          echo "Merge or close it before merging other PRs."
          exit 1
