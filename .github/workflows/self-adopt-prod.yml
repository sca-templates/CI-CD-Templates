---
name: "Self: Adopt Prod"
# Dry-run smoke of shared-adopt-prod. With the ApplicationSet default lookup
# this now fails when the service is not registered in the infra prod registry
# (argocd/services-prod.yaml) — point it at a real service to exercise the run.

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service name to smoke-test"
        type: string
        default: CI-CD-Templates
      release-tag:
        description: "Release tag to smoke-test (not required to exist)"
        type: string
        default: v0.0.0

permissions:
  contents: read

concurrency:
  group: self-adopt-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  adopt:
    name: Adopt Prod (dry-run)
    uses: ./.github/workflows/shared-adopt-prod.yml
    with:
      service: ${{ inputs.service }}
      release-tag: ${{ inputs.release-tag }}
      skip-tag-check: true
      dry-run: true
    secrets:
      APP_ID: ${{ secrets.DEPLOY_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
