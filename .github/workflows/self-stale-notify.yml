---
name: "Self: Stale Notify"

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report only, do not post comments"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Stale notify
    uses: ./.github/workflows/shared-stale-notify.yml
    with:
      issues-days: 30
      prs-days: 21
      remind-again: true
      dry-run: ${{ inputs.dry-run || false }}