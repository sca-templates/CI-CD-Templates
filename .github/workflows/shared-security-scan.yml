---
name: "Shared: Security Scan"

on:
  workflow_call:
    inputs:
      gitleaks:
        description: "Run gitleaks secret scanning"
        type: boolean
        default: true
      osv-scan:
        description: "Run osv-scanner dependency vulnerability scan"
        type: boolean
        default: true
      license-check:
        description: "Check license compliance"
        type: boolean
        default: false
      license-allowed:
        description: "Allowed licenses (comma-separated SPDX IDs)"
        type: string
        default: "MIT,Apache-2.0,ISC,BSD-2-Clause,BSD-3-Clause"
      sonar:
        description: "Run SonarQube Cloud SAST analysis"
        type: boolean
        default: true
      sonar-organization:
        description: "SonarQube Cloud organization key; empty uses sonar-project.properties"
        type: string
        default: ""
      sonar-project-key:
        description: "SonarQube project key; empty uses sonar-project.properties"
        type: string
        default: ""
      semgrep:
        description: "Run Semgrep static analysis (registry pack or rules path)"
        type: boolean
        default: true
      semgrep-config:
        description: "Semgrep rule configuration; OWASP rules: p/owasp-top-ten, CI default: p/ci"
        type: string
        default: "p/ci"
      semgrep-fail-on:
        description: "Fail the job when Semgrep reports findings"
        type: boolean
        default: false
      dependency-check:
        description: "Run OWASP Dependency-Check (NVD SCA)"
        type: boolean
        default: true
      fail-on-cvss:
        description: "Fail Dependency-Check on findings with CVSS score >= value (7 = high)"
        type: string
        default: "7"
      suppression-file:
        description: "Path to an OWASP Dependency-Check suppression XML file"
        type: string
        default: ""
    secrets:
      SONAR_TOKEN:
        description: "SonarQube Cloud analysis token; when unset SonarQube is skipped silently"
        required: false
      NVD_API_KEY:
        description: "NIST NVD API key (free); when unset Dependency-Check is skipped silently"
        required: false

permissions:
  contents: read

concurrency:
  group: security-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    if: ${{ inputs.gitleaks }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="v8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          printf '%s  %s\n' "${GITLEAKS_SHA256}" /tmp/gitleaks.tar.gz | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: gitleaks detect
        run: gitleaks detect --source . --report-format sarif --report-path gitleaks.sarif

      - name: Upload SARIF
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: gitleaks.sarif

  osv:
    name: Dependency Vulnerabilities (osv)
    if: ${{ inputs.osv-scan }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install osv-scanner
        run: |
          OSV_VERSION="v2.5.1"
          OSV_SHA256="f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be"
          curl -fsSL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" \
            -o /tmp/osv-scanner
          printf '%s  %s\n' "${OSV_SHA256}" /tmp/osv-scanner | sha256sum -c -
          chmod +x /tmp/osv-scanner
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner

      - name: osv-scanner scan
        run: |
          osv-scanner scan -r . || rc=$?
          # Exit 128 = no supported lockfiles found; nothing to scan, treat as success.
          if [ "${rc:-0}" -eq 128 ]; then
            echo "No supported lockfiles found - nothing to scan."
            exit 0
          fi
          exit "${rc:-0}"

  license:
    name: License Compliance
    if: ${{ inputs.license-check }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check licenses
        env:
          LICENSE_ALLOWED: ${{ inputs.license-allowed }}
        run: |
          echo "License compliance check — allowed: ${LICENSE_ALLOWED}"
          # TODO: implement with license-checker or similar tool
          echo "TODO: implement license compliance check"

  sonarqube:
    name: SonarQube Cloud
    if: ${{ inputs.sonar }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check SONAR_TOKEN
        id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN}" ]; then echo "run=true" >> "${GITHUB_OUTPUT}"; else echo "run=false" >> "${GITHUB_OUTPUT}"; fi

      - name: Checkout
        if: ${{ steps.check.outputs.run == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        if: ${{ steps.check.outputs.run == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build SonarQube args
        id: sonar-args
        if: ${{ steps.check.outputs.run == 'true' }}
        env:
          SONAR_ORGANIZATION: ${{ inputs.sonar-organization }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
        run: |
          ARGS=""
          if [ -n "${SONAR_ORGANIZATION}" ]; then
            ARGS="${ARGS} -Dsonar.organization=${SONAR_ORGANIZATION}"
          fi
          if [ -n "${SONAR_PROJECT_KEY}" ]; then
            ARGS="${ARGS} -Dsonar.projectKey=${SONAR_PROJECT_KEY}"
          fi
          echo "args=${ARGS}" >> "${GITHUB_OUTPUT}"

      - name: SonarQube Scan
        if: ${{ steps.check.outputs.run == 'true' }}
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: ${{ steps.sonar-args.outputs.args }}

      - name: Report skipped SonarQube analysis
        if: ${{ steps.check.outputs.run != 'true' }}
        run: echo "SonarQube analysis skipped - SONAR_TOKEN not configured."

  semgrep:
    name: Semgrep (OWASP rules)
    if: ${{ inputs.semgrep }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: pipx install semgrep==1.177.0

      - name: Semgrep scan
        env:
          SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
          SEMGREP_FAIL_ON: ${{ inputs.semgrep-fail-on }}
        run: |
          FAIL_ARGS=""
          if [ "${SEMGREP_FAIL_ON}" == "true" ]; then FAIL_ARGS="--error"; fi
          semgrep scan \
            --config "${SEMGREP_CONFIG}" \
            --metrics=off \
            --sarif-output semgrep.sarif \
            ${FAIL_ARGS}

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependency-check:
    name: Dependency Vulnerabilities (OWASP)
    if: ${{ inputs.dependency-check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check NVD_API_KEY
        id: check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "${NVD_API_KEY}" ]; then echo "run=true" >> "${GITHUB_OUTPUT}"; else echo "run=false" >> "${GITHUB_OUTPUT}"; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run OWASP Dependency-Check
        if: ${{ steps.check.outputs.run == 'true' }}
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # main (upstream tags predate SARIF support)
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: ${{ github.repository }}
          path: .
          format: SARIF
          out: reports
          args: >
            --format SARIF
            --failOnCVSS ${{ inputs.fail-on-cvss }}
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --disableCentral
            --disableOssIndex
            ${{ inputs.suppression-file && format('--suppression {0}', inputs.suppression-file) || '' }}

      - name: Upload SARIF to code scanning
        if: ${{ always() && steps.check.outputs.run == 'true' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload Dependency-Check report
        if: ${{ always() && steps.check.outputs.run == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owasp-dependency-check-report
          path: |
            reports/dependency-check-report.html
            reports/dependency-check-report.sarif
          if-no-files-found: ignore

      - name: Report skipped Dependency-Check
        if: ${{ steps.check.outputs.run != 'true' }}
        run: echo "OWASP Dependency-Check skipped - NVD_API_KEY not configured."